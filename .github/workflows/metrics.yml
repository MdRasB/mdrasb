name: Refresh GitHub Stats Cards

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats card
        run: |
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github-readme-stats.vercel.app/api?username=MdRasB&show_icons=true&theme=tokyonight&hide_border=true&include_all_commits=true&count_private=true" \
            -o new-stats.svg || true
          if grep -q "<svg" new-stats.svg 2>/dev/null; then
            mv new-stats.svg github-stats.svg
          else
            echo "Stats fetch failed this run — keeping previous version"
          fi

      - name: Fetch top languages card
        run: |
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=MdRasB&layout=compact&theme=tokyonight&hide_border=true&langs_count=6" \
            -o new-langs.svg || true
          if grep -q "<svg" new-langs.svg 2>/dev/null; then
            mv new-langs.svg github-langs.svg
          else
            echo "Top-langs fetch failed this run — keeping previous version"
          fi

      - name: Fetch activity graph
        run: |
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://github-readme-activity-graph.vercel.app/graph?username=MdRasB&theme=tokyo-night&hide_border=true&area=true" \
            -o new-activity.svg || true
          if grep -q "<svg" new-activity.svg 2>/dev/null; then
            mv new-activity.svg github-activity.svg
          else
            echo "Activity graph fetch failed this run — keeping previous version"
          fi

      - name: Commit refreshed cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg github-langs.svg github-activity.svg 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: refresh GitHub stats cards [skip ci]"
          git push

name: Generate GitHub Metrics SVG

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MdRasB
          filename: github-metrics.svg

          template: classic
          config_timezone: Asia/Dhaka
          config_display: large       # bigger, easier-to-read card
          base_indepth: yes           # richer, more clearly labeled core stats

          # Contribution calendar - shortened to half-year so it's less
          # cluttered / easier to scan than the full 12 months
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Top languages, with clear % labels
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_categories: markup, programming

name: Generate GitHub Metrics SVG

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MdRasB
          filename: github-metrics.svg

          template: classic
          config_timezone: Asia/Dhaka
          config_display: large
          base_indepth: yes

          # Contribution calendar (confirmed working from your last run)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Top languages with clear % labels
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_categories: markup, programming

          # plugin_lines and plugin_habits removed - both crashed in your run
          # plugin_topics removed - rendered empty, no topics on your starred repos

          # Real dark theme, built from the ACTUAL CSS classes in your
          # generated SVG - not guessed. Selectors below are copy-verified
          # from the file you sent (h1/h2/h3, .field svg, footer, etc.)
          extras_css: |
            .items-wrapper {
              background-color: #1a1b26;
              border-radius: 12px;
              padding: 20px 24px;
            }
            svg {
              color: #c0caf5 !important;
            }
            h1, h2, h3 {
              color: #7aa2f7 !important;
            }
            .field svg {
              fill: #7aa2f7 !important;
            }
            footer {
              color: #565f89 !important;
            }
            .field.language.details small,
            .field.license.details small {
              color: #a9b1d6 !important;
            }
            .field.error, .field.error svg {
              color: #f7768e !important;
              fill: #f7768e !important;
            }

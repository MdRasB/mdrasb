name: Generate GitHub Metrics SVG

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MdRasB
          filename: github-metrics.svg

          template: classic
          config_timezone: Asia/Dhaka
          config_display: large       # bigger, more readable card
          base_indepth: yes           # richer core-stats section with more detail

          # Contribution calendar (confirmed-working setting from before)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Top languages with clear % labels
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_details: percentage
          plugin_languages_categories: markup, programming

          # Lines of code changed over time — a colorful area chart
          plugin_lines: yes

          # Coding habits — busiest days/hours as visual charts
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          # Starred topics as a tag cloud — adds visual variety
          plugin_topics: yes
          plugin_topics_limit: 8

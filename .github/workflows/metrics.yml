name: Generate GitHub Metrics SVG

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:         # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main                 # also regenerate whenever you push to the profile repo

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed so the action can commit the SVG back to this repo
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: MdRasB
          filename: github-metrics.svg

          # --- Look & feel ---
          template: classic
          theme: tokyonight
          config_timezone: Asia/Dhaka

          # --- Core stats (stars, commits, issues, PRs, followers, rank) ---
          # enabled by default with the classic template

          # --- Contribution calendar (replaces the activity-graph card) ---
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # --- Top languages (replaces the top-langs card) ---
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_threshold: 0%

          # --- Recent activity feed ---
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_visibility: all
